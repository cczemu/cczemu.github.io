<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ccz&emu's blog</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/normalize.min.css" />
</head>

<body>
    <main>
        <div class="window">
            <div class="container">
                <div class="title">ccz's blog </div>
                <div class="buttons">
                    <div class="min">-</div>
                    <div class="max">☐</div>
                    <div class="close">X</div>
                </div>
            </div>
        </div>
        <div class="content">
            <h1>文章</h1>
            <ul id="md-list"></ul>
        </div>
        <div class="buttom">
            &copy; made by ccz
        </div>
    </main>
    <script>
        fetch("index.json", {
            cache: "no-cache", // 或者 'reload'
            headers: {
                "Cache-Control": "no-cache",
            },
        })
            .then((res) => res.json())
            .then((list) => {
                const ul = document.getElementById("md-list");
                list.forEach((file) => {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.href = `page.html?file=${encodeURIComponent(file)}`;
                    a.textContent = file;
                    a.target = "_self";
                    li.appendChild(a);
                    ul.appendChild(li);
                });
            });
    </script>
</body>

</html>
