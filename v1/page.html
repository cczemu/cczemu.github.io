<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
        <link rel="stylesheet" href="css/common.css" />
        <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="css/normalize.min.css" />
</head>

<body>
    <main>
        <div class="window">
            <div class="container">
                <div class="title"> <a href="javascript:history.back()">返回上一页</a> </div>
                <div class="buttons">
                    <div class="min">-</div>
                    <div class="max">☐</div>
                    <div class="close">X</div>
                </div>
            </div>
        </div>
        <div class="content">
            <div id="md-content"></div>
        </div>
        <div class="buttom">
            &copy; made by ccz
        </div>
        
    </main>
    <script src="js/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const file = params.get('file') || '你好.md'; // 默认值

        document.title = file.replace('.md', ''); // 设置标题为文件名（去掉扩展名）
        fetch('pages/' + file, {
            cache: 'no-cache', // 或者 'reload'
            headers: {
                'Cache-Control': 'no-cache'
            }
        })
            .then(response => response.text())
            .then(text => {
                document.getElementById('md-content').innerHTML = DOMPurify.sanitize(marked.parse(text));
            });
    </script>
</body>

</html>
